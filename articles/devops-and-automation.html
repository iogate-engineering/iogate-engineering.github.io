<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevOps &amp; Automation | iogate</title>
  <meta name="description" content="Reduce manual effort with CI/CD, infrastructure as code, environment standardisation, and operational automation." />
  <link rel="stylesheet" href="../styles.css?v=13" />
  <link rel="preconnect" href="https://fonts.bunny.net" />
  <link rel="stylesheet" href="https://fonts.bunny.net/css?family=inter:400,700,800" />
  <link rel="icon" type="image/svg+xml" href="/images/favicon/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon/favicon-96x96.png">
  <link rel="icon" href="/images/favicon/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/images/favicon/site.webmanifest">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/" aria-label="iogate home">
        <img src="/images/iogate-logo.png" alt="" class="brand-icon-img" width="2315" height="1316" />
        <img src="/images/iogate-logo-header-text.png" alt="iogate" class="brand-text-img" width="3014" height="839" />
      </a>
      <button class="menu-toggle" aria-expanded="false" aria-controls="site-nav" id="menuToggle">Menu</button>
      <nav class="nav" id="site-nav">
        <a href="/#services">Services</a>
        <a href="/#approach">Approach</a>
        <a href="/#about">Why iogate</a>
        <a href="/#experience">Experience</a>
        <a href="/#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero" style="padding: 4rem 0 2rem;">
      <div class="container">
        <a href="/articles/" class="eyebrow">&larr; All articles</a>
        <h1 style="max-width: 24ch;">DevOps &amp; Automation</h1>
        <p style="margin-top: 1.5rem; color: var(--muted); font-size: 1.05rem; line-height: 1.8; max-width: 60ch;">
          Reduce manual effort with CI/CD, infrastructure as code, environment standardisation, and operational automation.
        </p>
      </div>
    </section>

    <section class="section">
      <div class="container article-body">
        <!-- Replace this with your article content -->
        <p>Article content goes here.</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">&copy; <span id="year"></span> iogate. All rights reserved.</div>
  </footer>

  <script>
    const menuToggle = document.getElementById('menuToggle');
    const siteNav = document.getElementById('site-nav');
    const year = document.getElementById('year');
    if (year) year.textContent = new Date().getFullYear();
    if (menuToggle && siteNav) {
      menuToggle.addEventListener('click', function () {
        const isOpen = siteNav.classList.toggle('open');
        menuToggle.setAttribute('aria-expanded', String(isOpen));
      });
      siteNav.querySelectorAll('a').forEach(function (link) {
        link.addEventListener('click', function () {
          siteNav.classList.remove('open');
          menuToggle.setAttribute('aria-expanded', 'false');
        });
      });
    }
  </script>
</body>
</html>
